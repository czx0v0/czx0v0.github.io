  <script>
    (function () {
      var canvas = document.getElementById('starfield');
      if (!canvas || !canvas.getContext) return;
      var ctx = canvas.getContext('2d', { alpha: true });
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var cosmic = document.querySelector('.cosmic-window');

      function prefersReducedMotion() {
        return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      }

      function resize() {
        var rect = canvas.getBoundingClientRect();
        var w = Math.floor(rect.width * dpr);
        var h = Math.floor(rect.height * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      var WARM = '#f5d67a';
      var WHITE = '#ffffff';
      var count = 0;
      var stars = [];

      function initStars() {
        var rect = canvas.getBoundingClientRect();
        var cw = rect.width;
        var ch = rect.height;
        count = Math.min(200, Math.floor((cw * ch) / 3000));
        stars = [];
        for (var i = 0; i < count; i++) {
          var layer = Math.random();
          stars.push({
            x: Math.random() * cw,
            y: Math.random() * ch,
            vy: 7 + layer * 32,
            r: 0.35 + layer * 1.45,
            warm: Math.random() > 0.8,
            tw: Math.random() * Math.PI * 2,
            layer: layer
          });
        }
      }

      var aimX = 0;
      var aimY = 0;
      var smoothX = 0;
      var smoothY = 0;
      var pointerInside = false;
      var glowAlpha = 0;

      function syncPointerFromRect(cw, ch) {
        smoothX = cw * 0.5;
        smoothY = ch * 0.5;
        aimX = smoothX;
        aimY = smoothY;
      }

      if (cosmic) {
        cosmic.addEventListener(
          'pointermove',
          function (e) {
            var rect = cosmic.getBoundingClientRect();
            aimX = e.clientX - rect.left;
            aimY = e.clientY - rect.top;
            pointerInside = true;
          },
          { passive: true }
        );
        cosmic.addEventListener('pointerleave', function () {
          pointerInside = false;
        });
      }

      var last = 0;
      function tick(now) {
        if (!last) last = now;
        var dt = Math.min((now - last) / 1000, 0.05);
        last = now;

        var rect = canvas.getBoundingClientRect();
        var cw = rect.width;
        var ch = rect.height;
        var reduced = prefersReducedMotion();
        var speedMul = reduced ? 0.45 : 1;

        smoothX += (aimX - smoothX) * (pointerInside ? 0.14 : 0.08);
        smoothY += (aimY - smoothY) * (pointerInside ? 0.14 : 0.08);
        if (pointerInside) {
          glowAlpha = Math.min(1, glowAlpha + 0.06);
        } else {
          glowAlpha *= 0.9;
        }

        ctx.clearRect(0, 0, cw, ch);

        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          s.y += s.vy * dt * speedMul;
          s.x += Math.sin(s.tw + s.y * 0.008) * 7 * dt;
          s.tw += dt * (0.75 + s.layer * 0.5);

          if (s.y > ch + 8) {
            s.y = -8;
            s.x = Math.random() * cw;
            s.vy = 7 + Math.random() * 32;
            s.warm = Math.random() > 0.8;
          }

          var dz = 0.35 + s.layer * 0.65;
          var pulse = 0.88 + Math.sin(s.tw * 1.3) * 0.12;

          var dx = s.x - smoothX;
          var dy = s.y - smoothY;
          var dist = Math.sqrt(dx * dx + dy * dy);
          var spotlight = 1 + Math.max(0, 1 - dist / (Math.min(cw, ch) * 0.38)) * 0.55 * glowAlpha;

          ctx.globalAlpha = Math.min(1, (0.4 + dz * 0.55) * pulse * spotlight);
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = s.warm ? WARM : WHITE;
          ctx.fill();

          if (s.warm) {
            ctx.globalAlpha = Math.min(1, 0.22 * pulse * dz * spotlight);
            var rg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 2.8);
            rg.addColorStop(0, 'rgba(245,214,122,0.55)');
            rg.addColorStop(1, 'rgba(245,214,122,0)');
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r * 2.8, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (glowAlpha > 0.02) {
          var rGlow = Math.min(cw, ch) * 0.42;
          var g = ctx.createRadialGradient(smoothX, smoothY, 0, smoothX, smoothY, rGlow);
          g.addColorStop(0, 'rgba(255,252,255,' + 0.14 * glowAlpha + ')');
          g.addColorStop(0.35, 'rgba(227,159,246,' + 0.09 * glowAlpha + ')');
          g.addColorStop(0.65, 'rgba(227,159,246,' + 0.03 * glowAlpha + ')');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.save();
          ctx.globalCompositeOperation = 'screen';
          ctx.globalAlpha = 1;
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, cw, ch);
          ctx.restore();
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(tick);
      }

      function onResize() {
        resize();
        initStars();
        var rect = canvas.getBoundingClientRect();
        syncPointerFromRect(rect.width, rect.height);
      }

      window.addEventListener('resize', function () {
        onResize();
      });
      onResize();
      requestAnimationFrame(tick);
    })();
  </script>
