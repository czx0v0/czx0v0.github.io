<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Molecular Universe</title>
  <!-- Google Fonts: 科技风英文字体 + 中文字体 -->
  <link href="https://fonts.googleapis.com/css?family=Orbitron:700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=JetBrains+Mono:400,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Noto+Sans+SC:400,700&display=swap" rel="stylesheet">
  <!-- Three.js, SmilesDrawer, D3.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/smiles-drawer@1.0.10/dist/smiles-drawer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
  <!-- Vega和Vega-Lite -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5.25.0/build/vega.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.16.3/build/vega-lite.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.24.0/build/vega-embed.min.js"></script>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', 'Orbitron', 'Noto Sans SC', Arial, sans-serif;
      background: radial-gradient(ellipse at 60% 40%, #0a0e24 0%, #000 100%);
      color: #eaf6ff;
      overflow: hidden;
      transition: background 0.4s, color 0.4s;
    }

    body.light {
      background: radial-gradient(ellipse at 60% 40%, #f7f7fa 0%, #eaf6ff 100%);
      color: #222;
    }

    body {
      display: flex;
      flex-direction: row;
      height: 100vh;
      width: 100vw;
    }

    /* 面板样式 */
    .panel {
      min-width: 220px;
      max-width: 260px;
      padding: 1.2rem 0.7rem 0.7rem 0.7rem;
      background: rgba(10, 14, 36, 0.92);
      box-shadow: 0 0 32px #1a1a2a44;
      display: flex;
      flex-direction: column;
      z-index: 2;
      height: 100vh;
      overflow-y: auto;
      transition: background 0.4s, color 0.4s;
      font-family: 'JetBrains Mono', 'Orbitron', 'Noto Sans SC', Arial, sans-serif;
    }

    body.light .panel {
      background: rgba(255, 255, 255, 0.92);
      color: #222;
    }

    .panel.left {
      border-right: 1.5px solid rgba(227, 159, 246, 0.18);
      align-items: stretch;
      transition: width 0.3s, min-width 0.3s, max-width 0.3s, padding 0.3s;
    }

    .panel.right {
      min-width: 220px;
      max-width: 260px;
      overflow-y: auto;
      border-left: 1.5px solid rgba(227, 159, 246, 0.18);
      align-items: flex-start;
      transition: width 0.3s, min-width 0.3s, max-width 0.3s, padding 0.3s;
    }

    .panel.collapsed {
      min-width: 0 !important;
      max-width: 0 !important;
      width: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }

    /* 主3D区样式，支持多画布横向排列 */
    .main-3d {
      flex: 1 1 0;
      position: relative;
      height: 90vh;
      min-height: 480px;
      max-width: 100vw;
      overflow: auto;
      z-index: 1;
      background: transparent;
      display: flex;
      flex-direction: row;
      gap: 18px;
      align-items: stretch;
      justify-content: flex-start;
      padding: 12px 0;
    }

    /* 主区大标题 */
    .main-title {
      font-family: 'JetBrains Mono', 'Orbitron', 'Noto Sans SC', Arial, sans-serif;
      font-size: 2rem;
      font-weight: 900;
      color: #6c4bdb;
      text-align: center;
      letter-spacing: 0.09em;
      margin-bottom: 0.2em;
      margin-top: 0.2em;
    }

    /* 图例底部横向美观样式 */
    #legend-bar {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: fit-content;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.98);
      opacity: 0.93;
      padding: 0.5em 1.2em;
      font-family: 'Lato', Arial, sans-serif;
      font-size: 1rem;
      color: #6c4bdb;
      box-shadow: 0 2px 16px #e39ff644;
      display: flex;
      align-items: center;
      gap: 1.2em;
      border: 1.5px solid #eaeaea;
      pointer-events: auto;
      min-width: 100%;
      max-width: 45vw;
      justify-content: flex-start;
      z-index: 100;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: #e39ff6 #f7f7fa;
    }

    body.dark #legend-bar {
      background: rgba(30, 20, 40, 0.98);
      color: #eaf6ff;
      border: none;
      box-shadow: 0 2px 16px #6c4bdb44;
    }

    #legend-bar::-webkit-scrollbar {
      height: 7px;
      background: #f7f7fa;
    }

    #legend-bar::-webkit-scrollbar-thumb {
      background: #e39ff6;
      border-radius: 8px;
    }

    .legend-dot {
      display: inline-block;
      border-radius: 50%;
      margin-right: 0.3em;
      vertical-align: middle;
      border: 2px solid #fff;
      width: 16px;
      height: 16px;
      box-shadow: 0 1px 4px #e39ff622;
    }

    .legend-label {
      font-size: 0.97em;
      margin-right: 0.8em;
      font-family: 'JetBrains Mono', 'Orbitron', monospace;
      color: #6c4bdb;
      background: #f7f7fa;
      border-radius: 6px;
      padding: 0.08em 0.5em;
      display: inline-block;
      vertical-align: middle;
    }

    body.dark .legend-label {
      color: #eaf6ff;
      background: #18182a;
    }

    /* 缩放输入框美化，与缩放指示器同行 */
    .zoom-control {
      display: flex;
      align-items: center;
      gap: 0.3em;
      margin-left: 0.5em;
    }

    .zoom-input {
      width: 60px;
      font-family: 'JetBrains Mono', 'Orbitron', monospace;
      font-size: 1em;
      border: 1.5px solid #e39ff6;
      border-radius: 8px;
      padding: 0.1em 0.5em;
      background: #f7f7fa;
      color: #6c4bdb;
      outline: none;
      text-align: right;
      margin-left: 0.2em;
      transition: border 0.2s, background 0.2s;
    }

    body.dark .zoom-input {
      background: #18182a;
      color: #eaf6ff;
      border: 1.5px solid #6c4bdb;
    }

    .zoom-label {
      color: #a16cfb;
      font-family: 'JetBrains Mono', 'Orbitron', monospace;
      font-size: 1.08rem;
      font-weight: 700;
      /* margin-left: 0.3em; */
      /* margin-right: 0.2em; */
      letter-spacing: 0.01em;

    }

    /* 问号提示按钮 */
    .help-btn {
      background: #e39ff6;
      color: #fff;
      border-radius: 50%;
      width: 1.5em;
      height: 1.em;
      font-size: 1.2em;
      font-weight: bold;
      border: none;
      margin-left: 1.2em;
      cursor: pointer;
      box-shadow: 0 2px 8px #e39ff644;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .help-btn:hover {
      background: #6c4bdb;
    }

    .help-popover {
      position: fixed;
      left: 50%;
      /* bottom: 100px; */
      top: 100px;
      transform: translateX(-50%);
      background: #fff;
      color: #6c4bdb;
      border-radius: 12px;
      box-shadow: 0 2px 16px #e39ff644;
      padding: 1.1em 1.7em;
      font-size: 1.08em;
      font-family: 'JetBrains Mono', 'Orbitron', 'Noto Sans SC', Arial, sans-serif;
      z-index: 1000;
      border: 1.5px solid #eaeaea;
      display: none;
      min-width: 260px;
      max-width: 80vw;
      text-align: center;
      opacity: 93;

    }

    body.dark .help-popover {
      background: #18182a;
      color: #eaf6ff;
      border: 1.5px solid #6c4bdb;
    }

    /* 画布背景优化 */
    .main-3d-canvas,
    .main-3d-canvas.single {
      background: #f7f7fa !important;
      border-radius: 0;
      box-shadow: 0 2px 16px #e39ff622;
    }

    body.dark .main-3d-canvas,
    body.dark .main-3d-canvas.single {
      background: #18182a !important;
    }

    /* 主3D区样式，支持多画布竖直排列 */
    .main-3d {
      flex: 1 1 0;
      position: relative;
      height: 100vh;
      overflow: auto;
      z-index: 1;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: stretch;
      justify-content: flex-start;
      padding: 12px 0;
    }

    /* 标签层样式 */
    #label-layer,
    .label-layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .point-label {
      position: absolute;
      /* 必须加 */
      font-size: 0.82rem;
      color: #6c4bdbcc;
      background: rgba(255, 255, 255, 0.82);
      opacity: 0.7;
      padding: 1px 7px;
      border-radius: 8px;
      white-space: nowrap;
      text-shadow: none;
      transform: translate(0%, 0%);
      /* transform: translate(-50%, -100%); */
      /* margin-top: -4px; */
      pointer-events: none;
      border: 1px solid #eaeaea;
      font-family: 'JetBrains Mono', 'Orbitron', monospace;
      font-weight: 700;
      z-index: 11;
      transition: background 0.2s, color 0.2s;
    }

    body.dark .point-label {
      color: #eaf6ff;
      background: rgba(10, 14, 36, 0.85);
      text-shadow: 0 0 6px #000;
      border: none;
    }

    /* 气味标签云样式 */
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0.5rem 0 0.7rem 0;
      align-items: center;
      justify-content: flex-start;
      border-radius: 12px;
      background: #f7f7fa;
      padding: 0.3em 0.2em;
      min-height: 2.8em;
      /* 稍微加高 */
      max-height: 6.2em;
      overflow-y: auto;
      opacity: 0.93;
      box-shadow: 0 1px 4px #e39ff622;
      justify-content: center;
      text-align: center;
    }

    .tag {
      background: linear-gradient(135deg, #f7f7fa 60%, #eaf6ff 100%);
      color: #4a3fa7;
      border-radius: 18px;
      padding: 0.18rem 0.95rem;
      font-size: 1.01rem;
      font-family: 'JetBrains Mono', 'Orbitron', 'Noto Sans SC', Arial, sans-serif;
      opacity: 0.93;
      margin-bottom: 0.2rem;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
      cursor: pointer;
      font-weight: 600;
      border: 1.5px solid #e3e3f6;
      box-shadow: 0 1px 4px #e39ff622;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .tag.selected,
    .tag:hover {
      background: linear-gradient(90deg, #e39ff6 0%, #6c4bdb 100%);
      color: #fff;
      border: 1.5px solid #bbaaff;
      opacity: 1;
      box-shadow: 0 2px 8px #e39ff644;
    }

    /* 右侧分子字符串和学名字体统一 */
    .smiles-label {
      font-family: 'JetBrains Mono', 'Orbitron', 'Noto Sans SC', Arial, sans-serif;
      font-size: 1.13rem;
      color: #4a3fa7;
      background: rgba(0, 0, 0, 0.03);
      border-radius: 10px;
      padding: 0.22rem 0.7rem;
      margin-bottom: 0.5rem;
      display: inline-block;
      font-weight: 700;
      letter-spacing: 0.03em;
      border: 1.5px solid #eaeaea;
      box-shadow: 0 1px 4px #e39ff622;
    }

    .iupac-label {
      font-family: 'JetBrains Mono', 'Orbitron', 'Noto Sans SC', Arial, sans-serif;
      font-size: 1.08rem;
      color: #e39ff6;
      margin-bottom: 0.7rem;
      display: block;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    h1 {
      font-family: 'JetBrains Mono', 'Orbitron', 'Noto Sans SC', Arial, sans-serif;
      font-size: 1.45rem;
      color: #6c4bdb;
      font-weight: 900;
      letter-spacing: 0.08em;
      margin-bottom: 1.2rem;
      margin-top: 0.2rem;
      text-align: center;
      text-shadow: 0 2px 8px #e39ff633;
    }

    /* 2D分子图白底 */
    .mol2d-canvas,
    .sim-mol2d {
      background: #fff !important;
      border-radius: 16px;
      margin-bottom: 0.7rem;
      box-shadow: 0 0 12px #e39ff633;
      display: block;
      border: 1px solid #eaeaea;
    }

    .sim-mol2d {
      width: 38px;
      height: 28px;
      border-radius: 6px;
      margin-right: 0.3em;
      display: inline-block;
      vertical-align: middle;
      background: #fff !important;
    }

    /* 滚动条美化 */
    ::-webkit-scrollbar {
      width: 8px;
      background: #18182a;
    }

    ::-webkit-scrollbar-thumb {
      background: #6c4bdb88;
      border-radius: 8px;
    }

    #overview-modal {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(10, 14, 36, 0.55);
      backdrop-filter: blur(6px);
      transition: background 0.3s;
    }

    body.light #overview-modal {
      background: rgba(255, 255, 255, 0.75);
    }

    .overview-card {
      position: relative;
      z-index: 2;
      min-width: 600px;
      max-width: 98vw;
      min-height: 420px;
      max-height: 96vh;
      background: rgba(30, 34, 56, 0.85);
      border-radius: 24px;
      box-shadow: 0 0 32px #1a1a2a66;
      padding: 2.2rem 2.2rem 1.2rem 2.2rem;
      overflow-y: auto;
      backdrop-filter: blur(12px);
      color: #eaf6ff;
    }

    body.light .overview-card {
      background: rgba(255, 255, 255, 0.98);
      color: #222;
    }

    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }

      .panel.left,
      .panel.right {
        min-width: 100vw;
        max-width: 100vw;
        border: none;
        height: auto;
        box-shadow: none;
      }

      .main-3d {
        height: 60vw;
        min-height: 320px;
      }
    }

    .section-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.08rem;
      color: #6c4bdb;
      margin: 1.1rem 0 0.4rem 0;
      letter-spacing: 0.04em;
      font-weight: 700;
      text-align: left;
    }

    label,
    .label {
      font-size: 1rem;
      color: #6c4bdb;
      margin-bottom: 0.2rem;
      font-weight: 700;
    }

    /* Tab样式 */
    .tabs {
      display: flex;
      border-bottom: 1px solid #e39ff6;
      margin-bottom: 0.7em;
    }

    .tab-btn {
      flex: 1;
      padding: 0.5em 0;
      background: none;
      border: none;
      font-family: 'Orbitron', monospace;
      font-size: 1.02rem;
      color: #6c4bdb;
      cursor: pointer;
      border-bottom: 2.5px solid transparent;
      transition: border 0.2s, color 0.2s;
    }

    .tab-btn.active {
      color: #ff5e7e;
      border-bottom: 2.5px solid #ff5e7e;
      background: #f7f7fa22;
    }

    /* 美化select和button */
    select,
    input[type="range"],
    .multi-select {
      border: 1.5px solid #e39ff6;
      border-radius: 8px;
      background: #fff;
      color: #6c4bdb;
      padding: 0.25em 0.7em;
      margin-bottom: 0.5em;
      outline: none;
      transition: border 0.2s;
    }

    body.dark select {
      background: #18182a;
      color: #eaf6ff;
      border: 1.5px solid #6c4bdb;
    }

    button,
    .copy-btn {
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #e39ff6 0%, #6c4bdb 100%);
      color: #fff;
      font-family: 'Orbitron', monospace;
      font-size: 1.02rem;
      font-weight: 700;
      padding: 0.45em 1.2em;
      margin-bottom: 0.5em;
      cursor: pointer;
      box-shadow: 0 2px 8px #e39ff622;
      transition: background 0.2s, color 0.2s;
    }

    button:hover,
    .copy-btn:hover {
      background: #ff5e7e;
      color: #fff;
    }

    /* 数据概览表格样式 */
    .overview-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    .overview-table th,
    .overview-table td {
      padding: 0.8rem;
      text-align: left;
      border: 1px solid #eaeaea;
      font-size: 0.95rem;
    }

    .overview-table th {
      background: #f7f7fa;
      color: #6c4bdb;
      font-weight: 700;
    }

    .overview-table tr:nth-child(even) {
      background: #fafafa;
    }

    .overview-table tr:hover {
      background: #f1f1f1;
    }

    /* 3D canvas美化 */
    .main-3d canvas {
      border-radius: 18px;
      box-shadow: 0 0 32px #e39ff622, 0 2px 16px #0002;
      border: 1px solid #eaeaea;
      background: transparent;
      margin-top: 12px;
    }

    /* 标签云美化为圆角学术风格，固定高度+滚动条 */
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0.5rem 0 0.7rem 0;
      align-items: center;
      justify-content: flex-start;
      border-radius: 12px;
      background: #f7f7fa;
      padding: 0.3em 0.2em;
      min-height: 2.2em;
      max-height: 5.2em;
      overflow-y: auto;
      opacity: 0.93;
      box-shadow: 0 1px 4px #e39ff622;
      justify-content: center;
      text-align: center;
    }

    .tag {
      background: linear-gradient(135deg, #f7f7fa 60%, #eaf6ff 100%);
      color: #4a3fa7;
      border-radius: 18px;
      padding: 0.18rem 0.95rem;
      font-size: 1.01rem;
      font-family: 'JetBrains Mono', 'Orbitron', 'Noto Sans SC', Arial, sans-serif;
      opacity: 0.93;
      margin-bottom: 0.2rem;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
      cursor: pointer;
      font-weight: 600;
      border: 1.5px solid #e3e3f6;
      box-shadow: 0 1px 4px #e39ff622;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .tag.selected,
    .tag:hover {
      background: linear-gradient(90deg, #e39ff6 0%, #6c4bdb 100%);
      color: #fff;
      border: 1.5px solid #bbaaff;
      opacity: 1;
      box-shadow: 0 2px 8px #e39ff644;
    }

    /* 数据来源和许可证信息 */
    #data-info {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      color: #bbb;
      font-family: 'Lato', Arial, sans-serif;
      font-size: 0.85rem;
      z-index: 100;
      pointer-events: none;
      text-align: center;
    }

    #data-info a {
      color: #6c4bdb;
      text-decoration: none;
      transition: color 0.2s;
    }

    #data-info a:hover {
      color: #ff5e7e;
    }

    .main-3d-canvas {
      min-height: 220px;
      min-width: 220px;
      background: #f7f7fa !important;
      border-radius: 0;
      box-shadow: 0 2px 16px #e39ff622;
      position: relative;
      transition: all 0.3s;
    }

    body.dark .main-3d-canvas {
      background: #18182a !important;
    }

    /* Cooccurrence */
    #cooccurrence-ranking li {
      cursor: pointer;
      padding: 0.3em 0.7em;
      border-radius: 8px;
      margin-bottom: 0.2em;
      transition: background 0.18s, color 0.18s;
      font-family: 'JetBrains Mono', 'Orbitron', monospace;
      font-size: 1.01rem;
    }

    #cooccurrence-ranking li:hover {
      background: linear-gradient(90deg, #e39ff6 0%, #6c4bdb 100%);
      color: #fff;
    }

    #cooccurrence-ranking li.selected {
      background: #ff5e7e;
      color: #fff;
      font-weight: bold;
    }

    .collapse-btn {
      position: absolute;
      top: 12px;
      width: 24px;
      height: 24px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 100;
      outline: none;
      padding: 0;
    }

    .panel.left .collapse-btn {
      left: 8px;
      right: auto;
    }

    .panel.right .collapse-btn {
      right: 8px;
      left: auto;
    }

    .collapse-btn::before {
      content: '';
      display: block;
      width: 0;
      height: 0;
      margin: auto;
      border-style: solid;
      border-width: 12px 0 12px 16px;
      border-color: transparent transparent transparent #6c4bdb;
      transition: transform 0.3s;
    }

    .panel.left.collapsed .collapse-btn::before {
      transform: rotate(180deg);
    }

    .panel.right .collapse-btn::before {
      border-width: 12px 16px 12px 0;
      border-color: transparent #6c4bdb transparent transparent;
    }

    .panel.right.collapsed .collapse-btn::before {
      transform: rotate(180deg);
    }

    .panel.left,
    .panel.right {
      overflow: visible !important;
      position: relative;
      z-index: 10;
    }

    .collapse-btn {
      z-index: 1000;

      html += `<div style="display:inline-block;max-width:420px;overflow-x:auto;white-space:nowrap;vertical-align:middle;">`;

        labelLayer.className = 'label-layer';
        labelLayer.id = `label-layer-${i}`;
        div.appendChild(labelLayer);

    // ========== 多embedding 3D可视化 ==========
    function renderAll3D() {
      // 6个画布：0-2为fp_embeddings，3-5为lb_embeddings
      const embTypes = ['fp_embeddings', 'fp_embeddings', 'fp_embeddings', 'lb_embeddings', 'lb_embeddings', 'lb_embeddings'];
      const embKeys = ['pca', 'tsne', 'umap', 'pca', 'tsne', 'umap'];
      for (let i = 0; i < 6; ++i) {
        // 放大时只渲染被放大的画布
        if (enlargedCanvas !== -1 && enlargedCanvas !== i) continue;
        render3DFor(embKeys[i], `main-3d-${i}`, `label-layer-${i}`, embTypes[i]);
      }
    }

    // 渲染单个embedding画布
    function render3DFor(embedding, canvasId, labelLayerId, embeddingType = currentEmbeddingType) {
      // 清理旧canvas
      const container = document.getElementById(canvasId);
      // 移除旧canvas
      Array.from(container.getElementsByTagName('canvas')).forEach(c => c.remove());
      // 清理label
      const labelLayer = document.getElementById(labelLayerId);
      labelLayer.innerHTML = '';

      // // 过滤分子
      // filteredIdx = molecules.map((mol, i) => i)
      //   .filter(i => {
      //     const mol = molecules[i];
      //     if (mol.properties.molecular_weight > mwMax) return false;
      //     // 结构特征筛选（所有选中的特征都必须为1）
      //     if (featureFilter.length > 0 && !featureFilter.every(idx => mol.features && mol.features[idx] === 1)) return false;
      //     // 标签筛选
      //     if (labelFilter.length > 0 && !labelFilter.every(idx => mol.labels[idx] === 1)) return false;
      //     return true;
      //   })
      //   .slice(0, molLimit);
      // 渲染所有分子，不做筛选，只用颜色区分
      filteredIdx = molecules.map((mol, i) => i).slice(0, molLimit);

      // Three.js初始化
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setClearColor(theme === "dark" ? 0x000000 : 0xeaf6ff, 1);
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, renderer.domElement.width / renderer.domElement.height, 0.1, 1000);
      // 缩放控制
      let baseDistance = 60;
      let scale = 100 / zoomPercent;
      camera.position.set(0, 0, baseDistance / scale);

      // Controls
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.enablePan = false;
      controls.minDistance = 10;
      controls.maxDistance = 300;

      // 坐标轴辅助器
      const axesHelper = new THREE.AxesHelper(80);
      axesHelper.material.transparent = true;
      axesHelper.material.opacity = 0.25;
      scene.add(axesHelper);

      // 粒子
      let particleData = [];
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const colors = [];
      const sizes = [];
      const alphas = [];
      // 计算分子量范围
      const mwArr = filteredIdx.map(idx => molecules[idx].properties.molecular_weight);
      const mwMin = Math.min(...mwArr), mwMaxVal = Math.max(...mwArr);
      // 计算label_nums范围
      const labelNumArr = filteredIdx.map(idx => molecules[idx].label_nums || molecules[idx].labels.reduce((a, b) => a + b, 0));
      const labelNumMin = Math.min(...labelNumArr), labelNumMax = Math.max(...labelNumArr);

      filteredIdx.forEach((idx, i) => {
        const mol = molecules[idx];
        const emb = mol[embeddingType][embedding];
        positions.push(emb[0] * 50, emb[1] * 50, emb[2] * 50);

        // 判断共现状态
        let isSelected = false, isCooccur = false;
        if (labelFilter.length > 0 || featureFilter.length > 0) {
          // 任一标签/特征命中
          isSelected =
            labelFilter.some(lidx => mol.labels[lidx] === 1) ||
            featureFilter.some(fidx => mol.features[fidx] === 1);
          // 所有标签/特征都命中
          isCooccur =
            labelFilter.every(lidx => mol.labels[lidx] === 1) &&
            featureFilter.every(fidx => mol.features[fidx] === 1);
        } else {
          isSelected = true;
          isCooccur = false;
        }

        // // 颜色编码
        // let color = new THREE.Color();
        // if (colorMode === "aromatic") {
        //   color.set(mol.properties.is_aromatic ? "#ff5e7e" : "#6c4bdb");
        // } else {
        //   // 按标签颜色编码：取第一个标签的颜色
        //   const firstLabel = mol.labels.findIndex(v => v === 1);
        //   color.setStyle(labelColors[firstLabel >= 0 ? firstLabel : 0]);
        // }
        // colors.push(color.r, color.g, color.b);
        // 颜色编码（根据共现/选择的标签切换）
        let color = new THREE.Color();
        if (!isSelected) {
          color.setStyle('#bbb'); // 灰色
        } else if (isCooccur) {
          color.setStyle('#ff5e7e'); // 高亮色
        } else {
          // 普通彩色
          const firstLabel = mol.labels.findIndex(v => v === 1);
          color.setStyle(labelColors[firstLabel >= 0 ? firstLabel : 0]);
        }
        colors.push(color.r, color.g, color.b);

        // 大小编码（分子量，减小点大小，避免遮挡）
        let mw = mol.properties.molecular_weight;
        let size = 7 + 13 * ((mw - mwMin) / (mwMaxVal - mwMin + 0.01)); // 7~20
        sizes.push(size);

        // 透明度编码（label_nums，越多越不透明）
        const n = mol.label_nums || mol.labels.reduce((a, b) => a + b, 0);
        let alpha = 0.28 + 0.55 * ((n - labelNumMin) / (labelNumMax - labelNumMin + 0.01)); // 0.28~0.83
        alphas.push(alpha);

        // particleData.push({ idx, emb, color, size, alpha, labelNum: n });
        particleData.push({ idx, emb, color, size, alpha, labelNum: n, isCooccur });
      });

      // 创建label div（SMILES或散点）
      filteredIdx.forEach((idx, i) => {
        const mol = molecules[idx];
        const emb = mol[embeddingType][embedding];
        const labelDiv = document.createElement('div');
        labelDiv.className = 'point-label';

        // 重新计算 isSelected 和 isCooccur
        let isSelected = false, isCooccur = false;
        if (labelFilter.length > 0 || featureFilter.length > 0) {
          isSelected =
            labelFilter.some(lidx => mol.labels[lidx] === 1) ||
            featureFilter.some(fidx => mol.features[fidx] === 1);
          isCooccur =
            labelFilter.every(lidx => mol.labels[lidx] === 1) &&
            featureFilter.every(fidx => mol.features[fidx] === 1);
        } else {
          isSelected = true;
          isCooccur = false;
        }
        // // 计算粒子投影位置
        // if (showSmiles) {
        //   labelDiv.textContent = mol.smiles;
        //   labelDiv.style.fontSize = '';
        //   labelDiv.style.fontWeight = '';
        //   labelDiv.style.color = '';
        //   labelDiv.style.background = '';
        //   labelDiv.style.border = '';
        // } else {
        //   // labelDiv.textContent = '●';
        //   // labelDiv.style.fontSize = '1.5em';
        //   // labelDiv.style.fontWeight = 'bold';
        //   // labelDiv.style.color = colorMode === "aromatic"
        //   //   ? (mol.properties.is_aromatic ? "#ff5e7e" : "#6c4bdb")
        //   //   : labelColors[mol.labels.findIndex(v => v === 1) >= 0 ? mol.labels.findIndex(v => v === 1) : 0];
        //   // labelDiv.style.background = 'transparent';
        //   // labelDiv.style.border = 'none';
        //   // ...创建labelDiv时...
        //   if (particleData[i].isCooccur) {
        //     labelDiv.style.boxShadow = '0 0 0 3px #ff5e7e99';
        //     labelDiv.style.border = '2px solid #ff5e7e';
        //   } else if (!isSelected) {
        //     labelDiv.style.opacity = '0.25';
        //     labelDiv.style.filter = 'grayscale(0.7)';
        //     labelDiv.style.border = '';
        //     labelDiv.style.boxShadow = '';
        //   } else {
        //     labelDiv.style.border = '';
        //     labelDiv.style.boxShadow = '';
        //     labelDiv.style.opacity = '0.75';
        //     labelDiv.style.filter = '';
        //   }
        // }
        // // labelDiv.style.display = 'block';
        // labelDiv.style.display = showSmiles ? 'block' : 'none';
        // labelDiv.style.pointerEvents = 'none';
        // labelDiv.style.opacity = '0.75';
        // labelLayer.appendChild(labelDiv);
        // particleData[i].labelDiv = labelDiv;
        if (showSmiles) {
          labelDiv.textContent = mol.smiles;
          labelDiv.style.display = 'block';
        } else {
          labelDiv.textContent = '';
          labelDiv.style.display = 'none';
        }

        // 高亮/灰色逻辑
        if (particleData[i].isCooccur) {
          labelDiv.style.boxShadow = '0 0 0 3px #ff5e7e99';
          labelDiv.style.border = '2px solid #ff5e7e';
        } else if (!isSelected) {
          labelDiv.style.opacity = '0.25';
          labelDiv.style.filter = 'grayscale(0.7)';
          labelDiv.style.border = '';
          labelDiv.style.boxShadow = '';
        } else {
          labelDiv.style.border = '';
          labelDiv.style.boxShadow = '';
          labelDiv.style.opacity = '0.75';
          labelDiv.style.filter = '';
        }

        labelDiv.style.pointerEvents = 'none';
        labelLayer.appendChild(labelDiv);
        particleData[i].labelDiv = labelDiv;

      });
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
      geometry.setAttribute('alpha', new THREE.Float32BufferAttribute(alphas, 1));

      // 自定义ShaderMaterial实现颜色/大小/透明度
      const vertexShader = `
        attribute float size;
        attribute float alpha;
        varying float vAlpha;
        varying vec3 vColor;
        void main() {
          vColor = color;
          vAlpha = alpha;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * (300.0 / length(mvPosition.xyz));
          gl_Position = projectionMatrix * mvPosition;
        }
      `;
      // const fragmentShader = `
      //   varying float vAlpha;
      //   varying vec3 vColor;
      //   void main() {
      //     float dist = length(gl_PointCoord - vec2(0.5,0.5));
      //     if(dist > 0.5) discard;
      //     gl_FragColor = vec4(vColor, vAlpha * (1.0-dist*1.2));
      //   }
      // `;
      //高亮
      // 在 fragmentShader 里替换
      const fragmentShader = `
        varying float vAlpha;
        varying vec3 vColor;
        void main() {
          float dist = length(gl_PointCoord - vec2(0.5,0.5));
          float edge = smoothstep(0.45, 0.5, dist); // 0.45~0.5为边缘
          vec3 edgeColor = vec3(1.0, 0.36, 0.49); // #ff5e7e
          vec3 color = mix(vColor, edgeColor, edge);
          float alpha = vAlpha * (1.0 - dist * 1.2);
          if(dist > 0.5) discard;
          gl_FragColor = vec4(color, alpha);
        }
      `;
      const material = new THREE.ShaderMaterial({
        uniforms: {},
        vertexColors: true,
        transparent: true,
        vertexShader,
        fragmentShader
      });

      const particles = new THREE.Points(geometry, material);
      scene.add(particles);

      /// 动画与交互
      let hoveredIdx = null;
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      raycaster.params.Points.threshold = 0.25;

      renderer.domElement.onmousemove = function (event) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(particles);
        if (intersects.length > 0) {
          hoveredIdx = intersects[0].index;
          // 悬浮信息显示在粒子旁边
          // 可扩展为每个画布独立hover
        } else {
          hoveredIdx = null;
        }
      };
      renderer.domElement.onclick = function (event) {
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(particles);
        if (intersects.length > 0) {
          const idx = filteredIdx[intersects[0].index];
          updateMolInfo(idx);
        }
      };

      // 计算所有点的中心
      let center = [0, 0, 0];
      if (positions.length >= 3) {
        for (let i = 0; i < positions.length; i += 3) {
          center[0] += positions[i];
          center[1] += positions[i + 1];
          center[2] += positions[i + 2];
        }
        center = center.map(x => x / (positions.length / 3));
        camera.position.set(center[0], center[1], center[2] + 100);
        controls.target.set(center[0], center[1], center[2]);
        controls.update();
      }

      // 动画循环
      function animate() {
        controls.update();
        renderer.render(scene, camera);
        // 更新label位置
        // if (particleData.length) {
        //   for (let i = 0; i < particleData.length; ++i) {
        //     const emb = particleData[i].emb;
        //     const vector = new THREE.Vector3(emb[0] * 50, emb[1] * 50, emb[2] * 50);
        //     vector.project(camera);
        //     const x = (vector.x * 0.5 + 0.5) * renderer.domElement.clientWidth;
        //     const y = (1 - (vector.y * 0.5 + 0.5)) * renderer.domElement.clientHeight;
        //     // 在animate()中，设置labelDiv位置后加边界判断
        //     const labelDiv = particleData[i].labelDiv;
        //     if (labelDiv) {
        //       let lx = x, ly = y;
        //       // 限制在画布内
        //       const w = renderer.domElement.clientWidth;
        //       const h = renderer.domElement.clientHeight;
        //       const rect = labelDiv.getBoundingClientRect();
        //       // 这里假设label宽度最大150px
        //       if (lx < 0) lx = 0;
        //       if (lx > w - 10) lx = w - 10;
        //       if (ly < 0) ly = 0;
        //       if (ly > h - 10) ly = h - 10;
        //       labelDiv.style.left = `${lx + 30}px`; // 根据label长宽微调边界
        //       labelDiv.style.top = `${ly + 30}px`;
        //       labelDiv.style.display = showSmiles || !showSmiles ? 'block' : 'none';
        //     }
        //   }
        // }
        if (particleData.length) {
          for (let i = 0; i < particleData.length; ++i) {
            const emb = particleData[i].emb;
            const vector = new THREE.Vector3(emb[0] * 50, emb[1] * 50, emb[2] * 50);
            vector.project(camera);
            const x = (vector.x * 0.5 + 0.5) * renderer.domElement.clientWidth;
            const y = (1 - (vector.y * 0.5 + 0.5)) * renderer.domElement.clientHeight;
            const labelDiv = particleData[i].labelDiv;
            if (labelDiv) {
              let lx = x, ly = y;
              const w = renderer.domElement.clientWidth;
              const h = renderer.domElement.clientHeight;
              if (lx < 0) lx = 0;
              if (lx > w - 10) lx = w - 10;
              if (ly < 0) ly = 0;
              if (ly > h - 10) ly = h - 10;
              labelDiv.style.left = `${lx}px`;
              labelDiv.style.top = `${ly}px`;
              // 不要再设置 display
            }
          }
        }
        // 缩放指示器
        // document.getElementById('zoom-indicator').textContent = `缩放: ${zoomPercent}%`;
        requestAnimationFrame(animate);
      }
      animate();
    }

    // 重写主渲染入口
    function render3D() {
      renderAll3D();
      // 图例只渲染一次
      const mwArr = molecules.map(m => m.properties.molecular_weight);
      renderLegend(labelColors, labelNames, Math.min(...mwArr), Math.max(...mwArr));
    }

    // ========== 分子详情面板 ==========
    function updateMolInfo(idx) {
      selectedMol = idx;
      const mol = molecules[idx];
      document.getElementById('smiles-label').textContent = mol.smiles;
      document.getElementById('iupac-label').textContent = mol.properties.iupac_name || 'N/A';
      // 2D分子图白底
      const ctx = document.getElementById('mol2d').getContext('2d');
      ctx.save();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, 220, 160);
      ctx.restore();
      const drawer = new SmilesDrawer.Drawer({
        width: 220,
        height: 160,
        theme: 'light',
        padding: 10
      });
      SmilesDrawer.parse(mol.smiles, function (tree) {
        drawer.draw(tree, 'mol2d', 'light', false);
      }, function () {
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, 220, 160);
        ctx.fillStyle = "#222";
        ctx.font = "16px JetBrains Mono, Orbitron, Arial";
        ctx.fillText("无法解析", 80, 80);
      });
      // 标签云
      const tagCloud = document.getElementById('tag-cloud');
      tagCloud.innerHTML = '';
      mol.labels.forEach((v, i) => {
        if (v) {
          const span = document.createElement('span');
          span.className = 'tag';
          span.textContent = labelNames[i];
          span.style.fontSize = (1.1 + Math.random() * 0.6) + 'rem';
          span.style.background = labelColors[i];
          tagCloud.appendChild(span);
        }
      });
      // 推荐
      renderSimList('structural-sim', similarity.structural[idx], 'Tanimoto');
      renderSimList('label-sim', similarity.label[idx], 'Jaccard');
    }
    // 推荐列表加2D分子图
    function renderSimList(id, simArr, type) {
      const ul = document.getElementById(id);
      ul.innerHTML = '';
      let arr = simArr.map((v, i) => ({ i, v }))
        .filter(x => x.i !== selectedMol)
        .sort((a, b) => b.v - a.v)
        .slice(0, 5);
      arr.forEach(obj => {
        const li = document.createElement('li');
        // 增加canvas用于2D分子图
        li.innerHTML = `<canvas class="sim-mol2d" id="${id}-mol2d-${obj.i}" width="38" height="28"></canvas>
          <span>${molecules[obj.i].smiles}</span>
          <span class="sim-score">${obj.v.toFixed(2)}</span>`;
        li.onclick = () => updateMolInfo(obj.i);
        ul.appendChild(li);
        // 渲染2D分子图
        SmilesDrawer.parse(molecules[obj.i].smiles, function (tree) {
          const drawer = new SmilesDrawer.Drawer({ width: 38, height: 28, theme: 'light', padding: 2 });
          drawer.draw(tree, `${id}-mol2d-${obj.i}`, 'light', false);
        });
      });
    }

    function renderOverviewCharts() {
  const container = document.getElementById('overview-charts');
  if (!container) return;
  // container.innerHTML = `
  //   <div class="section-title">标签分布</div>
  //   <svg id="label-bar" width="100%" height="120"></svg>
  //   <div class="section-title">分子标签数分布</div>
  //   <svg id="tagnum-bar" width="100%" height="80"></svg>
  //   <div class="section-title">标签共现矩阵</div>
  //   <svg id="co-mat" width="100%" height="320"></svg>
  // `;
    const isDark = document.body.classList.contains('dark');
  container.innerHTML = `
    <div class="section-title">标签分布</div>
    <svg id="label-bar" width="100%" height="120" style="background:${isDark ? '#1e2238' : '#fff'};border-radius:12px;box-shadow:0 2px 12px #e39ff633;"></svg>
    <div class="section-title">分子标签数分布</div>
    <svg id="tagnum-bar" width="100%" height="80" style="background:${isDark ? '#1e2238' : '#fff'};border-radius:12px;box-shadow:0 2px 12px #e39ff633;"></svg>
    <div class="section-title">标签共现矩阵</div>
    <svg id="co-mat" width="100%" height="320" style="background:${isDark ? '#1e2238' : '#fff'};border-radius:12px;box-shadow:0 2px 12px #e39ff633;"></svg>
  `;

  // 标签分布
  const labelCounts = labelNames.map((name, i) =>
    molecules.reduce((acc, m) => acc + (m.labels[i] ? 1 : 0), 0)
  );
  // 分子标签数分布
  const tagNumDist = Array(20).fill(0);
  molecules.forEach(m => tagNumDist[m.labels.reduce((a, b) => a + b, 0)]++);
  // 共现矩阵
  const coMat = Array(labelNames.length).fill(0).map(() => Array(labelNames.length).fill(0));
  molecules.forEach(m => {
    m.labels.forEach((v, i) => {
      if (v) m.labels.forEach((w, j) => { if (w) coMat[i][j]++; });
    });
  });

  setTimeout(() => {
    // 标签分布
    const svg1 = d3.select("#label-bar");
    const w1 = 320, h1 = 120;
    svg1.attr("width", w1).attr("height", h1);
    const x1 = d3.scaleBand().domain(labelNames).range([0, w1]).padding(0.1);
    const y1 = d3.scaleLinear().domain([0, d3.max(labelCounts)]).range([h1 - 20, 10]);
    svg1.selectAll("rect")
      .data(labelCounts)
      .enter().append("rect")
      .attr("x", (d, i) => x1(labelNames[i]))
      .attr("y", d => y1(d))
      .attr("width", x1.bandwidth())
      .attr("height", d => h1 - 20 - y1(d))
      // .attr("fill", "#e39ff6");
      .attr("fill",isDark ? "#eaf6ff" : "#222");
    svg1.selectAll("text")
      .data(labelNames)
      .enter().append("text")
      .attr("x", (d, i) => x1(d) + x1.bandwidth() / 2)
      .attr("y", h1 - 4)
      .attr("text-anchor", "middle")
      .attr("font-size", "10px")
      .attr("fill", "#eaf6ff")
      .text(d => d);

    // 标签数分布
    const svg2 = d3.select("#tagnum-bar");
    const w2 = 320, h2 = 80;
    svg2.attr("width", w2).attr("height", h2);
    const x2 = d3.scaleBand().domain(d3.range(tagNumDist.length)).range([0, w2]).padding(0.1);
    const y2 = d3.scaleLinear().domain([0, d3.max(tagNumDist)]).range([h2 - 20, 10]);
    svg2.selectAll("rect")
      .data(tagNumDist)
      .enter().append("rect")
      .attr("x", (d, i) => x2(i))
      .attr("y", d => y2(d))
      .attr("width", x2.bandwidth())
      .attr("height", d => h2 - 20 - y2(d))
      .attr("fill", "#6c4bdb");
    svg2.selectAll("text")
      .data(tagNumDist)
      .enter().append("text")
      .attr("x", (d, i) => x2(i) + x2.bandwidth() / 2)
      .attr("y", h2 - 4)
      .attr("text-anchor", "middle")
      .attr("font-size", "10px")
      .attr("fill", "#eaf6ff")
      .text((d, i) => i);

    // 共现矩阵
    const svg3 = d3.select("#co-mat");
    const w3 = 320, h3 = 320;
    svg3.attr("width", w3).attr("height", h3);
    const cell = w3 / labelNames.length;
    const flatCoMat = coMat.flat();
    const maxCo = Math.max(...flatCoMat);
    svg3.selectAll("rect")
      .data(flatCoMat)
      .enter().append("rect")
      .attr("x", (d, i) => cell * (i % labelNames.length))
      .attr("y", (d, i) => cell * Math.floor(i / labelNames.length))
      .attr("width", cell)
      .attr("height", cell)
      .attr("fill", d => d > 0 ? d3.interpolateCool(d / maxCo) : "#222");
    // 可选：加标签
    svg3.selectAll("text.row")
      .data(labelNames)
      .enter().append("text")
      .attr("class", "row")
      .attr("x", 2)
      .attr("y", (d, i) => cell * i + cell / 2 + 4)
      .attr("font-size", "10px")
      .attr("fill", "#eaf6ff")
      .text(d => d);
    svg3.selectAll("text.col")
      .data(labelNames)
      .enter().append("text")
      .attr("class", "col")
      .attr("x", (d, i) => cell * i + cell / 2)
      .attr("y", 10)
      .attr("text-anchor", "middle")
      .attr("font-size", "10px")
      .attr("fill", "#eaf6ff")
      .text(d => d);
  }, 100);
}
    // 计算共现对排行榜
    function computeCooccurrenceRanking() {
      const labelCount = labelNames.length;
      const featureCount = data.metadata.feature_names.length;
      const pairCounts = [];

      // 标签-标签对
      for (let i = 0; i < labelCount; ++i) {
        for (let j = i + 1; j < labelCount; ++j) {
          let count = molecules.filter(m => m.labels[i] && m.labels[j]).length;
          pairCounts.push({ type: 'label-label', i, j, count });
        }
      }
      // 标签-特征对
      for (let i = 0; i < labelCount; ++i) {
        for (let j = 0; j < featureCount; ++j) {
          let count = molecules.filter(m => m.labels[i] && m.features[j]).length;
          pairCounts.push({ type: 'label-feature', i, j, count });
        }
      }
      // 排序取前12
      pairCounts.sort((a, b) => b.count - a.count);
      return pairCounts.slice(0, 12);
    }

    function renderCooccurrenceRanking() {
      const ranking = computeCooccurrenceRanking();
      const ul = document.getElementById('cooccurrence-ranking');
      ul.innerHTML = '';
      ranking.forEach(item => {
        const li = document.createElement('li');
        let isSelected = false;
        if (item.type === 'label-label') {
          li.textContent = `${labelNames[item.i]} + ${labelNames[item.j]} : ${item.count}`;
          li.onclick = () => {
            labelFilter = [item.i, item.j];
            featureFilter = [];
            syncLabelFilterUI();
            render3D();
            renderCooccurrenceRanking(); // 重新渲染高亮
          };
          // 判断是否当前选中
          isSelected = labelFilter.length === 2 && labelFilter.includes(item.i) && labelFilter.includes(item.j) && featureFilter.length === 0;
        } else {
          li.textContent = `${labelNames[item.i]} + ${data.metadata.feature_names[item.j]} : ${item.count}`;
          li.onclick = () => {
            labelFilter = [item.i];
            featureFilter = [item.j];
            syncLabelFilterUI();
            render3D();
            renderCooccurrenceRanking();
          };
          isSelected = labelFilter.length === 1 && labelFilter[0] === item.i && featureFilter.length === 1 && featureFilter[0] === item.j;
        }
        if (isSelected) li.classList.add('selected');
        ul.appendChild(li);
      });
    }

    window.addEventListener('resize', () => {
      if (renderer && camera) {
        const w = document.getElementById('main-3d').clientWidth;
        const h = document.getElementById('main-3d').clientHeight;
